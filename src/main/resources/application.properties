spring.application.name=projeto-spring-jwt

# ---- MySQL CONNECTIONS ----

# Local DB
#spring.datasource.url=jdbc:mysql://localhost:3306/controle_de_gastos
#spring.datasource.username=root
#spring.datasource.password=1234

# Square
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Driver JDBC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Optional settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Security Properties
security.config.prefix=${JWT_PREFIX}
security.config.key=${JWT_KEY}
security.config.expiration=3600000

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

#logs
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Smtp Email
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#config port
server.port=${PORT:80}
server.address=0.0.0.0